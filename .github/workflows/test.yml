name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/byos_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm test:redis
      - run: pnpm test:integration

  deployment:
    name: deployment (${{ matrix.compose }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose: [v2.39.1, v5.7.1]
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Compose CLI
        env:
          COMPOSE_VERSION: ${{ matrix.compose }}
        run: |
          set -euo pipefail
          compose_dir="$RUNNER_TEMP/compose-$COMPOSE_VERSION"
          mkdir -p "$compose_dir"
          cd "$compose_dir"
          release="https://github.com/docker/compose/releases/download/$COMPOSE_VERSION"
          curl -fsSL --retry 3 "$release/docker-compose-linux-x86_64" -o docker-compose-linux-x86_64
          curl -fsSL --retry 3 "$release/docker-compose-linux-x86_64.sha256" -o docker-compose-linux-x86_64.sha256
          sha256sum -c docker-compose-linux-x86_64.sha256
          install -D -m 755 docker-compose-linux-x86_64 "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Deployment helper regressions
        run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py'
      - name: Verify both build contexts exclude deployment secrets
        run: python3 scripts/deployment/check-build-context.py
