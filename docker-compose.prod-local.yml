name: byos-${PROJECT:?PROJECT is required}

services:
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        POSTGRES_DB: byos
      volumes:
        - postgres-data:/var/lib/postgresql/data
      ports:
        - "${POSTGRES_HOST_PORT:-55432}:5432"
      deploy:
        resources:
          limits:
            memory: "256M"
            cpus: "0.2"
      logging:
        driver: json-file
        options:
          max-size: "20m"
          max-file: "3"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 2s
        timeout: 2s
        retries: 15

    redis:
      image: redis:7-alpine
      restart: unless-stopped
      # --appendonly yes is required so the byos:known-subsolvers set survives
      # container restarts (ADR-0017). Without it, every restart re-triggers
      # the "new sub-solver" Slack notification for every known subsolver.
      command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      volumes:
        - redis-data:/data
      ports:
        - "${REDIS_HOST_PORT:-56379}:6379"
      deploy:
        resources:
          limits:
            memory: "1G"
            cpus: "0.5"
      logging:
        driver: json-file
        options:
          max-size: "20m"
          max-file: "3"
      healthcheck:
        test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
        interval: 2s
        timeout: 2s
        retries: 15
        start_period: 180s

    byos:
      image: byos-service:local
      restart: unless-stopped
      command: ["node", "apps/byos/dist/index.js"]
      env_file: env/${PROJECT}/.env.byos
      environment:
        DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/byos
        REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      ports:
        - "${BYOS_PUBLIC_HOST_PORT:-59585}:9585"
        - "${BYOS_INTERNAL_HOST_PORT:-59586}:9586"
      deploy:
        resources:
          limits:
            memory: "512M"
            cpus: "0.5"
      logging:
        driver: json-file
        options:
          max-size: "100m"
          max-file: "5"
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://localhost:9585/healthz || exit 1"]
        interval: 3s
        timeout: 2s
        retries: 20
        start_period: 10s

    fynd:
      image: ghcr.io/propeller-heads/fynd:0.122.0
      restart: unless-stopped
      command: ["serve", "--chain", "bsc", "--tycho-url", "tycho-fynd-bsc.propellerheads.xyz"]
      env_file: env/${PROJECT}/.env.fynd
      ports:
        - "${FYND_HOST_PORT:-53000}:3000"
      deploy:
        resources:
          limits:
            memory: "2G"
            cpus: "1"
      logging:
        driver: json-file
        options:
          max-size: "100m"
          max-file: "5"

    fynd-subsolver:
      image: byos-service:local
      restart: unless-stopped
      command: ["node", "apps/fynd-subsolver/dist/index.js"]
      # The shared image probes the BYOS API; sub-solver commands do not run it.
      healthcheck:
        disable: true
      env_file: env/${PROJECT}/.env.fynd-subsolver
      environment:
        FYND_URL: http://fynd:3000
        BYOS_URL: http://byos:9585
        CONFIG_PATH: config/bsc/subsolver.toml
      ports:
        - "${FYND_SUBSOLVER_HOST_PORT:-53002}:3001"
      deploy:
        resources:
          limits:
            memory: "256M"
            cpus: "0.2"
      logging:
        driver: json-file
        options:
          max-size: "50m"
          max-file: "5"
      depends_on:
        fynd:
          condition: service_started
        byos:
          condition: service_healthy

    binance-subsolver:
      image: byos-service:local
      restart: unless-stopped
      command: ["node", "apps/binance-subsolver/dist/index.js"]
      # The shared image probes the BYOS API; sub-solver commands do not run it.
      healthcheck:
        disable: true
      env_file: env/${PROJECT}/.env.binance-subsolver
      environment:
        SOLVE_PORT: 3002
        BYOS_URL: http://byos:9585
      ports:
        - "${BINANCE_SUBSOLVER_HOST_PORT:-53003}:3002"
      deploy:
        resources:
          limits:
            memory: "256M"
            cpus: "0.2"
      logging:
        driver: json-file
        options:
          max-size: "50m"
          max-file: "5"
      depends_on:
        byos:
          condition: service_healthy

    # private-mm-subsolver:
    #   image: byos-service:local
    #   restart: unless-stopped
    #   command: ["node", "apps/private-mm-subsolver/dist/index.js"]
    #   env_file: env/${PROJECT}/.env.private-mm-subsolver
    #   environment:
    #     BYOS_URL: http://byos:9585
    #   deploy:
    #     resources:
    #       limits:
    #         memory: "128M"
    #         cpus: "0.2"
    #   depends_on:
    #     byos:
    #       condition: service_healthy

    admin:
      restart: unless-stopped
      image: byos-admin:local
      env_file: env/${PROJECT}/.env.admin
      environment:
        DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/byos
      ports:
        - "${ADMIN_HOST_PORT:-53001}:3000"
      deploy:
        resources:
          limits:
            memory: "256M"
            cpus: "0.2"
      logging:
        driver: json-file
        options:
          max-size: "20m"
          max-file: "3"
      depends_on:
        byos:
          condition: service_healthy
volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-byos-${PROJECT}_postgres-data}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-byos-${PROJECT}_redis-data}
