name: byos-prod-local

services:
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: byos
      volumes:
        - postgres-data:/var/lib/postgresql/data
      ports:
        - "55432:5432"
      deploy:
        resources:
          limits:
            memory: "256M"
            cpus: "0.2"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 2s
        timeout: 2s
        retries: 15

    redis:
      image: redis:7-alpine
      restart: unless-stopped
      # --appendonly yes is required so the byos:known-subsolvers set survives
      # container restarts (ADR-0017). Without it, every restart re-triggers
      # the "new sub-solver" Slack notification for every known subsolver.
      command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
      volumes:
        - redis-data:/data
      ports:
        - "56379:6379"
      deploy:
        resources:
          limits:
            memory: "128M"
            cpus: "0.1"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 2s
        timeout: 2s
        retries: 15

    byos:
      image: byos-service:local
      restart: unless-stopped
      command: ["node", "apps/byos/dist/index.js"]
      env_file: .env.byos
      environment:
        DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/byos
        REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ports:
        - "59585:9585"
        - "59586:9586"
      deploy:
        resources:
          limits:
            memory: "512M"
            cpus: "0.5"
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://localhost:9585/healthz || exit 1"]
        interval: 3s
        timeout: 2s
        retries: 20
        start_period: 10s

    fynd:
      image: ghcr.io/propeller-heads/fynd:0.109.1
      restart: unless-stopped
      command: ["serve", "--chain", "bsc", "--tycho-url", "tycho-fynd-bsc.propellerheads.xyz"]
      environment:
        TYCHO_API_KEY: ${TYCHO_API_KEY}
      ports:
        - "53000:3000"
      deploy:
        resources:
          limits:
            memory: "2G"
            cpus: "1"

    fynd-subsolver:
      image: byos-service:local
      restart: unless-stopped
      command: ["node", "apps/fynd-subsolver/dist/index.js"]
      env_file: .env.fynd-subsolver
      environment:
        FYND_URL: http://fynd:3000
        BYOS_URL: http://byos:9585
        CONFIG_PATH: config/bsc/subsolver.toml
      deploy:
        resources:
          limits:
            memory: "256M"
            cpus: "0.2"
      depends_on:
        fynd:
          condition: service_started
        byos:
          condition: service_healthy

    private-mm-subsolver:
      image: byos-service:local
      restart: unless-stopped
      command: ["node", "apps/private-mm-subsolver/dist/index.js"]
      env_file: .env.private-mm-subsolver
      environment:
        BYOS_URL: http://byos:9585
      deploy:
        resources:
          limits:
            memory: "128M"
            cpus: "0.2"
      depends_on:
        byos:
          condition: service_healthy

    admin:
      restart: unless-stopped
      build:
        context: .
        dockerfile: apps/admin/Dockerfile
      env_file: .env.admin
      environment:
        DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/byos
      ports:
        - "53001:3000"
      deploy:
        resources:
          limits:
            memory: "256M"
            cpus: "0.2"
      depends_on:
        byos:
          condition: service_healthy
volumes:
  postgres-data:
  redis-data: